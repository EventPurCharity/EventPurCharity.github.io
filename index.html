v.innerHTML=`<div class="row"><span><b>Échanges</b><br><small style="color:var(--mu)">Gère tes offres d’échange avec tes amis</small></span><button id="tnew">+ Proposer un échange</button></div><div class="bar" id="tsub"></div><div id="tl"></div>`;

[["in","Reçues"],["out","Envoyées"],["old","Historique"]].forEach(([k,l])=>{const b=document.createElement("button");b.className="ghost"+(k===trSub?" on":"");b.textContent=l;const n=k==="in"?badge("tr"):0;if(n){const d=document.createElement("span");d.className="dot";d.textContent=n;b.appendChild(d)}b.onclick=()=>{trSub=k;tr(v)};$("tsub").appendChild(b)});
const L=trades.filter(t=>trSub==="in"?t.status==="pending"&&t.to_user===me:trSub==="out"?t.status==="pending"&&t.from_user===me:t.status!=="pending");
const tl=$("tl");if(!L.length)tl.innerHTML="<p class='sub'>Aucune offre ici.</p>";L.forEach(t=>tl.appendChild(tradeBox(t)))}
function tradeBox(t){const it=tradeItems[t.id]||{give:[],want:[]},sent=t.from_user===me,o=sent?t.to_user:t.from_user,d=document.createElement("div");d.className="tc";
d.innerHTML=`<b>${sent?"Offre envoyée à ":"Offre reçue de "}${nm(o)}${t.parent_id?" (contre-offre)":""}</b><div class="cols"><div><h4>${sent?"Tu donnes":nm(t.from_user)+" donne"}</h4><div class="mini" id="g"></div></div><div><h4>${sent?nm(t.to_user)+" donne":"Tu donnes"}</h4><div class="mini" id="w"></div></div></div><div class="ac"></div>`;
it.give.forEach(c=>byId[c]&&d.querySelector("#g").appendChild(el(byId[c])));it.want.forEach(c=>byId[c]&&d.querySelector("#w").appendChild(el(byId[c])));
const a=d.querySelector(".ac"),i=t.id;
a.innerHTML=t.status!=="pending"?`<span>${esc(ST[t.status]||t.status)}</span>`:sent?`<button class="ghost" data-a="tno" data-i="${i}">Annuler l’offre</button>`:`<button data-a="tacc" data-i="${i}">Accepter</button><button class="ghost" data-a="tctr" data-i="${i}">Contre-offre</button><button class="ghost" data-a="tno" data-i="${i}">Refuser</button>`;return d}
async function friendColl(fid){const r=await sb.from("inventory").select("card_id,qty").eq("user_id",fid),inv={};(r.data||[]).forEach(x=>inv[x.card_id]=x.qty);
const o=$("tmv"),u=CARDS.filter(c=>inv[c.n]).length;o.hidden=false;
o.innerHTML=`<div class="tm"><div class="hd2 row" style="margin:0"><b>Collection de ${nm(fid)}</b><button class="ghost" id="tx">✕</button></div><div class="sm" style="text-align:center;color:var(--mu)">${u} / ${CARDS.length} cartes découvertes</div><div class="gr"><div class="grid" id="fg"></div></div></div>`;
$("tx").onclick=closeT;
CARDS.slice().sort((a,b)=>Object.keys(R).indexOf(b.r)-Object.keys(R).indexOf(a.r)).forEach(c=>{const n=inv[c.n]||0;$("fg").appendChild(el(c,{locked:!n,n}))})}
function pickFriend(){const fl=friends.filter(f=>f.status==="accepted").map(f=>f.requester===me?f.addressee:f.requester),o=$("tmv");o.hidden=false;
o.innerHTML=`<div class="tm" style="max-width:480px"><div class="hd2 row" style="margin:0"><b>Choisir un ami</b><button class="ghost" id="tx">✕</button></div><div class="sm"><input id="fs" placeholder="Rechercher…" style="width:100%"></div><div class="gr" id="fl"></div></div>`;
$("tx").onclick=closeT;
const draw=()=>{const q=$("fs").value.toLowerCase();$("fl").innerHTML=fl.filter(i=>(names[i]||"").toLowerCase().includes(q)).map(i=>`<div class="row"><span>${nm(i)}</span><button class="ghost" data-f="${esc(i)}">Échanger →</button></div>`).join("")||"<p class='sub'>Aucun ami trouvé (ajoute-en dans l’onglet Amis)</p>"};
$("fs").oninput=draw;draw();$("fl").onclick=e=>{const b=e.target.closest("[data-f]");if(b)openTrade(b.dataset.f,null)}}
async function openTrade(fid,parent){
const r=await sb.from("inventory").select("card_id,qty").eq("user_id",fid),theirs={};(r.data||[]).forEach(x=>theirs[x.card_id]=x.qty);
const S={mine:new Set(),theirs:new Set(),side:"mine",q:"",rar:"all"},o=$("tmv");
if(parent){const it=tradeItems[parent.id]||{give:[],want:[]};it.want.forEach(c=>{if(own[c])S.mine.add(c)});it.give.forEach(c=>{if(theirs[c])S.theirs.add(c)})}
const drawGrid=()=>{const g=$("tg"),sel=S[S.side],inv={};
if(S.side==="mine")Object.keys(own).forEach(k=>{const n=own[k]-(pend[k]||0);if(n>0)inv[k]=n});else Object.assign(inv,theirs);
g.innerHTML="";Object.keys(inv).map(k=>byId[k]).filter(c=>c&&(S.rar==="all"||c.r===S.rar)&&c.n.toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>Object.keys(R).indexOf(b.r)-Object.keys(R).indexOf(a.r)).forEach(c=>{
const d=el(c,{n:inv[c.n]});d.style.animation="none";d.style.cursor="pointer";if(sel.has(c.n))d.classList.add("sel");d.onclick=()=>{sel.has(c.n)?sel.delete(c.n):sel.add(c.n);drawGrid()};g.appendChild(d)});
if(!g.children.length)g.innerHTML="<p class='sub'>Aucune carte.</p>";
$("sum").textContent=`Moi : ${S.mine.size} carte(s) ⇄ ${names[fid]||"?"} : ${S.theirs.size} carte(s)`;$("ts").disabled=!(S.mine.size&&S.theirs.size)};
const shell=()=>{o.hidden=false;
o.innerHTML=`<div class="tm"><div class="hd2 row" style="margin:0"><b>${parent?"Contre-offre pour ":"Échanger avec "}${nm(fid)}</b><button class="ghost" id="tx">✕</button></div><div class="sm" id="sum" style="text-align:center;color:var(--mu)"></div>
<div class="bar" style="margin:0 0 6px"><button class="ghost${S.side==="mine"?" on":""}" id="t1">Mes cartes</button><button class="ghost${S.side==="theirs"?" on":""}" id="t2">Cartes de ${nm(fid)}</button></div>
<div class="bar" style="margin:0 16px 6px"><input id="q" placeholder="Rechercher…" value="${esc(S.q)}"><select id="rr"><option value="all">Toutes les raretés</option>${Object.keys(R).map(k=>`<option value="${k}"${S.rar===k?" selected":""}>${R[k].l}</option>`).join("")}</select></div>
<div class="gr"><div class="grid" id="tg"></div></div><div class="ft2"><button class="ghost" id="tc">Annuler</button><button id="ts">Envoyer l’offre</button></div></div>`;
$("tx").onclick=$("tc").onclick=closeT;$("t1").onclick=()=>{S.side="mine";shell()};$("t2").onclick=()=>{S.side="theirs";shell()};
$("q").oninput=e=>{S.q=e.target.value;drawGrid()};$("rr").onchange=e=>{S.rar=e.target.value;drawGrid()};
$("ts").onclick=async()=>{const give=[...S.mine],want=[...S.theirs];
try{if(parent)await rpc("counter_trade",{p_id:parent.id,p_give:give,p_want:want});else await rpc("propose_trade",{p_to:fid,p_give:give,p_want:want})}catch(e){return}
closeT();tab="tr";trSub="out";await refresh();buildTabs();view()};drawGrid()};
shell()}
$("v").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,p_id=+b.dataset.i;
if(a==="fcol"){friendColl(b.dataset.f);return}
if(a==="tctr"){const t=trades.find(x=>x.id===p_id);if(t)openTrade(t.from_user,t);return}
try{if(a==="acc")await rpc("accept_friend",{p_id});else if(a==="del")await rpc("remove_friend",{p_id});else if(a==="tacc")await rpc("accept_trade",{p_id});else await rpc("respond_trade",{p_id})}catch(x){return}
await refresh();ui();buildTabs();view()};
async function boot(){const r=await sb.auth.getSession(),u=r.data.session&&r.data.session.user;
$("login").hidden=!!u;$("app").hidden=!u;if(!u)return;me=u.id;await refresh();
$("who").textContent="Connecté : "+(prof?prof.twitch_name:"");lastNid=notes.length?notes[0].id:0;ui();buildTabs();bell();view();setInterval(poll,12000)}
$("tw").onclick=()=>sb.auth.signInWithOAuth({provider:"twitch",options:{redirectTo:location.origin+location.pathname}});
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("sw").onclick=async()=>{await sb.auth.signOut();await sb.auth.signInWithOAuth({provider:"twitch",options:{redirectTo:location.origin+location.pathname,queryParams:{force_verify:"true"}}})};
(()=>{const h=$("hearts");for(let i=0;i<22;i++){const e=document.createElement("span");e.textContent="♥";e.style.left=Math.random()*100+"%";e.style.fontSize=(10+Math.random()*22)+"px";e.style.animationDuration=(14+Math.random()*22)+"s";e.style.animationDelay=(-Math.random()*30)+"s";h.appendChild(e)}})();
boot();
</script></body></html>
