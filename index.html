<style>

:root{color-scheme:dark;--bg:#12011f;--bg2:#2a0646;--tx:#f6ecff;--mu:#b79ad1;--ac:#b44dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#6a1bb355,transparent 60%),linear-gradient(115deg,transparent 38%,#ffffff0c 47%,transparent 56%),linear-gradient(180deg,#2e0750,#1a0230 55%,#12011f) fixed;color:var(--tx);font-family:"Oswald","Arial Narrow",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(#ffffff09 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;color:#a78bfa;text-shadow:0 0 12px #a855f7;opacity:.45;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-115vh) rotate(25deg)}}
.hd{text-align:center;margin:6px 0 10px}
.hd .k{font-family:"Archivo Black",Impact,sans-serif;letter-spacing:3px;font-size:clamp(13px,2.6vw,22px);color:#fff;text-shadow:0 0 12px #c026d3,0 0 26px #a855f7;margin:0 0 12px}
.hd .pt{display:inline-block;background:#1a0630cc;border:1px solid #ffffff22;border-radius:22px;padding:10px 16px 8px;box-shadow:0 0 24px #0009;text-decoration:none}
.hd .pt img{display:block;height:clamp(100px,16vw,150px);margin:0 auto}
.hd .pt span{display:block;font-weight:700;font-size:12px;letter-spacing:2px;color:#d7c5ee;margin-top:6px;text-transform:uppercase}
.hd .lg{display:block;margin:12px auto 0;width:min(420px,80%);filter:drop-shadow(0 0 18px #a855f7aa)}
.hd .ed{display:block;margin:0 auto;width:min(220px,50%)}
.ft{text-align:center;border-top:1px solid #a855f755;padding-top:22px;margin-top:44px;color:#cdbbe6;font-size:15px;letter-spacing:.5px}
.ft a{color:#d8b4fe}.ft p{margin:6px 0}
main{max-width:1000px;margin:0 auto;padding:20px 14px 60px;position:relative;z-index:1}
h1{text-align:center;font-size:clamp(28px,6vw,46px);margin:8px 0 2px;letter-spacing:1px;text-shadow:0 0 18px var(--ac)}
.sub{text-align:center;color:var(--mu);margin:0 0 18px}
.bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 26px;color:#fff;background:linear-gradient(135deg,#8a2be2,#d946ef);font-weight:700;box-shadow:0 0 18px #b44dff88}
button.ghost{background:#ffffff14;box-shadow:none;padding:8px 16px;font-weight:400}
button.ghost.on{background:var(--ac)}
.prog{text-align:center;color:var(--mu);margin-bottom:14px}
.meter{height:8px;border-radius:9px;background:#ffffff18;max-width:420px;margin:6px auto 0;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8a2be2,#ffb629)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.pack{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 26px;min-height:0}
.pack .card{width:150px}
.card{--c:#9aa0b4;position:relative;border-radius:14px;padding:3px;background:linear-gradient(145deg,var(--c),#0008);text-align:center;animation:pop .5s both}
.card .in{background:#1a0630;border-radius:11px;padding:10px 8px 8px;height:100%}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--c);display:block;margin:0 auto 8px;max-width:104px}
.card b{display:block;font-size:14px;overflow-wrap:anywhere}
.card small{color:var(--c);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.card img.logo{border-radius:16px;object-fit:contain;max-width:112px}
.card.rare{box-shadow:0 0 12px #4da3ff88}
.card.epic{box-shadow:0 0 16px #b44dffcc}
.card.leg{box-shadow:0 0 22px #ffb629;background:linear-gradient(120deg,#ffb629,#fff2b0,#ff7a18,#ffb629);background-size:300% 300%;animation:pop .5s both,shine 3s linear infinite}
.card.epic{background:linear-gradient(120deg,#b44dff,#e8c4ff,#6a1bd1,#b44dff);background-size:300% 300%;animation:pop .5s both,shine 4s linear infinite}
.card.locked{filter:grayscale(1) brightness(.35);box-shadow:none;animation:none}
.card.locked img{filter:blur(3px)}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--ac);border-radius:999px;font-size:12px;padding:2px 8px;font-weight:700}
.new{position:absolute;top:-8px;left:-6px;background:#ffb629;color:#220;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:800}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:300% 0}}
.cardback{width:150px;height:200px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:42px;background:repeating-linear-gradient(45deg,#3b0a66,#3b0a66 10px,#4a1180 10px,#4a1180 20px);border:3px solid #d946ef;box-shadow:0 0 14px #b44dff88;animation:pop .5s both;transition:transform .15s}
.cardback:hover{transform:translateY(-6px) scale(1.04)}
.ds{font-size:11px;color:var(--mu);margin:6px 0 0;line-height:1.3}
.card.ultra{--c:#ff4da6;box-shadow:0 0 18px #fff,0 0 40px #ff4da6;background:linear-gradient(120deg,#ff4d4d,#ffb629,#4dff88,#4da3ff,#b44dff,#ff4d4d);background-size:400% 400%;animation:pop .5s both,shine 2.5s linear infinite}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov[hidden]{display:none}
.bx{background:#1a0630;border:2px solid var(--ac);border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center}
.bx h2{margin:0 0 8px}.bx p{color:var(--mu)}
.bx input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ac);background:#12011f;color:var(--tx);font:inherit;text-align:center}
.er{color:#ff7a8a;min-height:18px;font-size:13px}
#md .card{width:230px}#md .card img{max-width:150px}#md .ds{font-size:13px}
button:disabled{opacity:.4;cursor:default}
footer{text-align:center;color:var(--mu);font-size:12px;margin-top:34px}

.row{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#ffffff10;border-radius:12px;padding:8px 12px;margin:6px 0;flex-wrap:wrap}
select,input{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--ac);background:#12011f;color:var(--tx);max-width:100%}
h3{margin:18px 0 4px}
.dot{background:#ff3b6b;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:20;background:#1a0630;border:2px solid var(--ac);border-radius:14px;padding:12px 16px;max-width:300px;box-shadow:0 0 20px #b44dff88;animation:pop .3s both}
.nl{text-align:left}.ni{padding:10px;border-radius:10px;margin:6px 0;background:#ffffff10;font-size:14px}.ni.un{background:#b44dff33;border-left:3px solid var(--ac)}
.tm{background:#12011ff2;border:2px solid var(--ac);border-radius:18px;width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.tm .hd2,.tm .sm,.tm .ft2{padding:10px 16px}.tm .gr{overflow:auto;padding:10px 16px;flex:1}.tm .ft2{display:flex;gap:10px}.tm .ft2 button{flex:1}
.card.sel{outline:3px solid #34d399;outline-offset:2px}
.card.sel::after{content:"✓";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#34d399;color:#031;border-radius:50%;width:22px;height:22px;line-height:22px;font-weight:800;font-size:14px}
.mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.mini .card{width:96px}.mini .card img{max-width:52px}.mini .card b{font-size:11px}.mini .card small{font-size:9px}
.tc{background:#ffffff10;border-radius:14px;padding:12px;margin:10px 0}.tc .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tc h4{margin:0 0 6px;color:var(--mu);font-weight:400;text-align:center}.tc .ac{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.godb{flex-basis:100%;text-align:center;font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(22px,5vw,38px);color:#ffe28a;text-shadow:0 0 18px #ffb629,0 0 40px #ff7a18;animation:pop .6s both}
.god .cardback{border-color:#ffb629;box-shadow:0 0 22px #ffb629;background:repeating-linear-gradient(45deg,#7a5200,#7a5200 10px,#a87400 10px,#a87400 20px)}
</style>
